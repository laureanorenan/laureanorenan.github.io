<style>
/* ── Tokens da identidade RLhub · Modelo A "Clareza" (set/2026) ───────
   Poucos cartões brancos sobre fundo suave, borda de 1px, sem sombra.
   Azul só para ação e local atual; verde só para evolução; perdas em
   grafite com seta e sinal (sem vermelho); âmbar em texto usa o tom
   escuro. Tema escuro = derivado da mesma paleta (texto ≥ 4.5:1). */
:root {
  --surface:#F7F8FA; --surface-raised:#FFFFFF; --surface-hover:#EEF0F3;
  --line:#E6E9EE; --border-control:#6B7280;
  --ink:#1D232B; --ink-muted:#6B7280;
  --brand:#2457A7; --brand-hover:#1B4585; --on-brand:#FFFFFF; --brand-soft:#EAF0F9;
  --positive:#198754; --positive-soft:#E8F3EC;
  --negative:#1D232B; --negative-soft:#EEF0F3;
  --attention:#C88719; --attention-ink:#8F5E0C; --attention-line:#EFD9AE;
  --on-attention:#1D232B; --attention-soft:#FBF3E4;

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-6:24px; --space-8:32px; --space-12:48px;
  --radius-sm:8px; --radius-control:10px; --radius-md:12px; --radius-lg:16px; --radius-full:9999px;
  --font-heading:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

  /* sombra só no que flutua (menu da conta, dica) */
  --shadow-sm:0 8px 24px #1D232B0F;
  --focus-ring:0 0 0 2px var(--surface), 0 0 0 4px var(--brand);

  --trilho-w:88px; --dock-h:64px;
}
:root[data-theme="dark"] {
  --surface:#12151A; --surface-raised:#1B1F26; --surface-hover:#242932;
  --line:#2A2F37; --border-control:#6B7584;
  --ink:#F2F4F7; --ink-muted:#9AA3AF;
  --brand:#6CA0E0; --brand-hover:#8DB6E8; --on-brand:#12151A; --brand-soft:#16233A;
  --positive:#3FCB86; --positive-soft:#0F2A1C;
  --negative:#F2F4F7; --negative-soft:#242932;
  --attention:#E3A542; --attention-ink:#E3A542; --attention-line:#5A4213;
  --on-attention:#12151A; --attention-soft:#2A2008;
  --shadow-sm:0 8px 24px #00000080;
}

*,*::before,*::after { box-sizing:border-box; }
html,body { height:100%; }
body { margin:0; background:var(--surface); color:var(--ink);
  font-family:var(--font-sans); font-size:15px; line-height:22px; overflow:hidden;
  -webkit-font-smoothing:antialiased; }
button,input { font:inherit; color:inherit; }
a { color:inherit; text-decoration:none; }
:focus-visible { outline:none; box-shadow:var(--focus-ring); border-radius:var(--radius-sm); }
.rotulo { font-size:12px; line-height:16px; font-weight:500; letter-spacing:.02em; color:var(--ink-muted); }
.legenda { font-size:12px; line-height:16px; color:var(--ink-muted); }
.num { font-variant-numeric:tabular-nums; }

/* ── Trilho de ícones ──────────────────────────────────────────────── */
.trilho { position:fixed; top:0; bottom:0; left:0; width:var(--trilho-w); z-index:20;
  background:var(--surface-raised); border-right:1px solid var(--line);
  display:flex; flex-direction:column; align-items:center; padding:var(--space-6) 0 var(--space-4); gap:var(--space-2); }
.selo { width:40px; height:40px; border-radius:11px; background:var(--brand);
  display:grid; place-items:center; margin-bottom:var(--space-6); flex-shrink:0; }
.selo b { font-family:var(--font-heading); font-size:16px; font-weight:700; letter-spacing:-.02em; color:var(--on-brand); }
.marca-grande .nome { font-family:var(--font-heading); font-size:22px; font-weight:500; color:var(--ink-muted); letter-spacing:-.02em; }
.marca-grande .nome i { font-style:normal; font-weight:600; color:var(--ink); }
.ic-btn { width:68px; min-height:44px; padding:10px 0; border:0; background:transparent; border-radius:var(--radius-md);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  cursor:pointer; color:var(--ink-muted); flex-shrink:0; position:relative;
  font-size:11px; line-height:14px; font-weight:500;
  transition:background-color .16s ease, color .16s ease; }
.ic-rot { white-space:nowrap; }
.ic-btn svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.6;
  stroke-linecap:round; stroke-linejoin:round; }
.ic-btn:hover { background:var(--surface-hover); color:var(--ink); }
.ic-btn[aria-current="page"] { background:var(--brand-soft); color:var(--brand); font-weight:600; }
.ic-btn .tranca { position:absolute; right:16px; top:8px; width:7px; height:7px;
  border-radius:var(--radius-full); background:var(--attention); display:none; }
.ic-btn[data-trancado="sim"] .tranca { display:block; }
.trilho-fim { margin-top:auto; display:flex; flex-direction:column; align-items:center; gap:var(--space-2); }
.avatar { width:36px; height:36px; margin-top:var(--space-2); flex-shrink:0; border-radius:var(--radius-full); border:0; cursor:pointer;
  background:var(--brand); color:var(--on-brand); font-size:13px; font-weight:600; }

/* dica que aparece ao lado do ícone */
.dica { position:fixed; z-index:40; background:var(--ink); color:var(--surface-raised);
  font-size:12px; line-height:16px; padding:6px var(--space-2); border-radius:var(--radius-sm);
  pointer-events:none; opacity:0; transition:opacity .12s ease; white-space:nowrap; }
.dica[data-ver="sim"] { opacity:1; }

/* ── Conta ─────────────────────────────────────────────────────────── */
.conta-pop { position:fixed; left:calc(var(--trilho-w) + 8px); bottom:16px; z-index:45;
  min-width:240px; background:var(--surface-raised); border:1px solid var(--line);
  border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:var(--space-4); display:none; }
.conta-pop[data-ver="sim"] { display:block; }
.conta-pop .quem { font-size:13px; font-weight:600; color:var(--ink); word-break:break-all; margin-bottom:var(--space-2); }
.btn-linha { width:100%; height:40px; border:1px solid var(--line); border-radius:var(--radius-control);
  background:var(--surface-raised); cursor:pointer; font-size:14px; font-weight:600; margin-top:var(--space-3); }
.btn-linha:hover { background:var(--surface-hover); }

/* ── Palco ─────────────────────────────────────────────────────────── */
.palco { position:fixed; top:0; left:var(--trilho-w); right:0; bottom:0; overflow:hidden; }

/* painel */
.painel { height:100%; overflow-y:auto; padding:var(--space-12) var(--space-12) var(--space-12); }
.painel-cab { display:flex; align-items:flex-end; gap:var(--space-4); margin-bottom:var(--space-8); flex-wrap:wrap; }
.painel-tit { display:flex; flex-direction:column; gap:var(--space-1); }
.ola { font-family:var(--font-heading); font-size:32px; line-height:40px; font-weight:600; letter-spacing:-.02em; color:var(--ink); margin:0; }
.hoje { font-size:14px; line-height:20px; color:var(--ink-muted); }
.hoje::first-letter { text-transform:uppercase; }
.cab-fim { margin-left:auto; display:flex; align-items:center; gap:var(--space-2); }
.busca { display:flex; align-items:center; gap:var(--space-2); height:44px; width:280px;
  padding:0 var(--space-4); border-radius:var(--radius-full); background:var(--surface-raised);
  border:1px solid var(--line); color:var(--ink-muted); }
.busca:focus-within { border-color:var(--brand); box-shadow:var(--focus-ring); }
.busca svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.8; flex-shrink:0; }
.busca input { border:0; background:transparent; outline:none; width:100%; font-size:14px; color:var(--ink); }
.busca input:focus-visible { box-shadow:none; }
.busca input::placeholder { color:var(--ink-muted); }

.mosaico { display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:132px; gap:var(--space-4); }
/* cartões: borda fina e espaço, sem sombra; o hover só troca a borda */
.w { display:flex; flex-direction:column; min-width:0; text-align:left;
  background:var(--surface-raised); border:1px solid var(--line); border-radius:var(--radius-lg);
  padding:var(--space-6); cursor:pointer; color:inherit;
  transition:border-color .16s ease; }
.w:hover { border-color:var(--brand); }
.w:focus-visible { border-radius:var(--radius-lg); }
.w.grande { grid-column:span 2; grid-row:span 2; }
.w.alta { grid-row:span 2; }
.w-cab { display:flex; align-items:center; gap:var(--space-2); font-size:13px; font-weight:500;
  color:var(--ink-muted); }
.w-ic { width:28px; height:28px; border-radius:var(--radius-sm); background:var(--brand-soft);
  color:var(--brand); display:grid; place-items:center; flex-shrink:0; }
.w-cab svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.6;
  stroke-linecap:round; stroke-linejoin:round; }
.w h2 { font-family:var(--font-heading); margin:var(--space-4) 0 0; font-size:20px; line-height:28px; font-weight:600; color:var(--ink); }
.w.grande h2 { font-size:24px; line-height:32px; letter-spacing:-.015em; }
.w p { margin:var(--space-2) 0 0; font-size:14px; line-height:20px; color:var(--ink-muted); }
.w-fim { display:block; margin-top:auto; padding-top:var(--space-4); }
.w-pe { display:flex; align-items:center; justify-content:space-between; gap:var(--space-2);
  margin-top:var(--space-3); padding-top:var(--space-3); border-top:1px solid var(--line); }
.w-end { font-size:12px; color:var(--ink-muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.w-valor { display:inline-flex; align-items:center; gap:var(--space-2);
  font-size:28px; line-height:36px; font-weight:600; letter-spacing:-.01em;
  font-variant-numeric:tabular-nums; color:var(--ink); }
.w-valor svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2.2;
  stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
.w-valor.pos svg { color:var(--positive); } .w-valor.neg svg { color:var(--negative); }
.w-abrir { display:inline-flex; align-items:center; gap:var(--space-2); font-size:14px; color:var(--brand); font-weight:600; }
.w-abrir svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.selo-trancado { display:inline-flex; align-items:center; gap:var(--space-1); font-size:12px; line-height:16px;
  font-weight:500; padding:4px var(--space-2); border-radius:var(--radius-full);
  background:var(--attention-soft); color:var(--attention-ink); }
.selo-trancado::before { content:""; width:6px; height:6px; border-radius:var(--radius-full); background:var(--attention); }
.w[hidden] { display:none; }
.vazio { grid-column:1/-1; padding:var(--space-8); text-align:center; color:var(--ink-muted); font-size:14px; }

/* página carregada */
.app-cab { height:56px; display:flex; align-items:center; gap:var(--space-3);
  padding:0 var(--space-6); border-bottom:1px solid var(--line); background:var(--surface-raised); }
.app-cab h1 { font-family:var(--font-heading); margin:0; font-size:18px; line-height:26px; font-weight:600; letter-spacing:-.01em;
  color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.app-cab .grupo { font-size:12px; font-weight:500; letter-spacing:.02em; color:var(--ink-muted); white-space:nowrap; }
.app-acoes { margin-left:auto; display:flex; align-items:center; gap:var(--space-2); }
.btn-pequeno { height:36px; padding:0 var(--space-3); border-radius:var(--radius-control);
  border:1px solid var(--line); background:var(--surface-raised); color:var(--ink); cursor:pointer;
  font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:var(--space-2); }
.btn-pequeno:hover { background:var(--surface-hover); }
.btn-pequeno svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.moldura { position:absolute; top:56px; left:0; right:0; bottom:0; }
.moldura iframe { width:100%; height:100%; border:0; display:block; background:var(--surface); }
.carregando { position:absolute; inset:0; display:grid; place-items:center;
  background:var(--surface); color:var(--ink-muted); font-size:13px; }

/* ── Entrada ───────────────────────────────────────────────────────── */
.entrar-area { height:100%; overflow-y:auto; display:grid; place-items:center; padding:var(--space-8); }
.entrar { width:100%; max-width:400px; background:var(--surface-raised);
  border:1px solid var(--line); border-radius:var(--radius-lg); padding:var(--space-8); }
.entrar .marca-grande { display:flex; align-items:center; gap:var(--space-3); margin-bottom:var(--space-6); }
.entrar .marca-grande .selo { margin:0; }
.entrar h2 { font-family:var(--font-heading); font-size:20px; line-height:28px; font-weight:600; color:var(--ink); margin:0 0 var(--space-2); }
.entrar .por-que { font-size:14px; line-height:20px; color:var(--ink-muted); margin:0 0 var(--space-6); }
.campo-bloco { margin-bottom:var(--space-4); }
.campo-bloco label { display:block; margin-bottom:var(--space-1); }
.campo-bloco label { font-size:13px; font-weight:500; color:var(--ink); letter-spacing:0; }
.campo-bloco input { width:100%; height:44px; border:1px solid var(--line);
  border-radius:var(--radius-control); background:var(--surface); color:var(--ink);
  padding:0 var(--space-3); font-size:15px; transition:border-color .16s ease; }
.campo-bloco input::placeholder { color:var(--ink-muted); }
.campo-bloco input:focus { outline:none; border:2px solid var(--brand); padding:0 11px; background:var(--surface-raised); box-shadow:none; }
.btn-entrar { width:100%; height:44px; border:0; border-radius:var(--radius-control); margin-top:var(--space-2);
  background:var(--brand); color:var(--on-brand); font-size:15px; font-weight:600; cursor:pointer; }
.btn-entrar:hover { background:var(--brand-hover); }
.btn-entrar:disabled { opacity:.6; cursor:default; }
.aviso { margin:var(--space-4) 0 0; font-size:14px; line-height:20px; }
.aviso.erro { padding:var(--space-3) var(--space-4); border-radius:var(--radius-md); background:var(--attention-soft);
  border:1px solid var(--attention-line); color:var(--attention-ink); font-weight:500; }
.entrar .rodape { margin:var(--space-6) 0 0; padding-top:var(--space-4); border-top:1px solid var(--line); }

/* sem sessão: só a tela de entrar */
body[data-conta="fora"] .trilho,
body[data-conta="verificando"] .trilho { display:none; }
body[data-conta="fora"] .palco,
body[data-conta="verificando"] .palco { left:0; }
body[data-conta="fora"] .conta-pop { display:none; }

@media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none !important; } }

/* ── Telas estreitas: o trilho vira uma doca embaixo ───────────────── */
@media (max-width:820px) {
  .trilho { top:auto; left:12px; right:12px; bottom:12px; width:auto; height:var(--dock-h);
    flex-direction:row; justify-content:space-around; align-items:center; gap:0;
    padding:0 var(--space-2); border:1px solid var(--line); border-radius:20px; }
  .selo { display:none; }
  .ic-btn { width:auto; flex:1 1 0; min-width:0; padding:6px 0; font-size:10px; line-height:12px; }

  .trilho-fim { margin:0; flex-direction:row; flex:2 1 0; justify-content:space-around; align-items:center; }
  .avatar { margin:0; width:32px; height:32px; }
  .palco { left:0; bottom:calc(var(--dock-h) + 24px); }
  .conta-pop { left:12px; right:12px; bottom:calc(var(--dock-h) + 20px); }
  .painel { padding:var(--space-6) var(--space-4) var(--space-8); }
  .ola { font-size:26px; line-height:34px; }
  .cab-fim { margin-left:0; width:100%; }
  .busca { width:100%; }
  .mosaico { grid-template-columns:repeat(2,1fr); grid-auto-rows:auto; }
  .w { min-height:176px; padding:var(--space-4); }
  .w.grande { grid-column:span 2; grid-row:span 1; }
  .w.alta { grid-row:span 1; }
  .app-cab { padding:0 var(--space-4); }
  .dica { display:none; }
}
@media (max-width:520px) {
  .mosaico { grid-template-columns:1fr; }
  .w.grande { grid-column:span 1; }
}
</style>

try {
  if (window.supabase && window.supabase.createClient) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }
} catch (e) { console.warn("Supabase indisponível:", e); }

/* ── Tema (chave compartilhada com as páginas do hub) ──────────────── */
var loja = {
  get: function (k, d) { try { var v = localStorage.getItem("pt_" + k); return v === null ? d : v; } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem("pt_" + k, v); } catch (e) {} }
};

function temaAtual() { return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light"; }

function aplicarTema(t) {
  document.documentElement.setAttribute("data-theme", t);
  loja.set("tema", t);
  var b = $("btnTema");
  if (b) {
    b.innerHTML = (t === "dark" ? ICONES.sol : ICONES.lua) + '<span class="ic-rot">Tema</span>';
    b.setAttribute("aria-label", t === "dark" ? "Usar tema claro" : "Usar tema escuro");
  }
  propagarTema();
}
function propagarTema() {
  var f = document.querySelector("#palco iframe");
  if (!f) return;
  try {
    var doc = f.contentDocument;
    if (doc && doc.documentElement) doc.documentElement.setAttribute("data-theme", temaAtual());
  } catch (e) {}
}

/* ── Trilho ────────────────────────────────────────────────────────── */
function montarTrilho() {
  var html = '<a class="selo" href="#/" title="Painel do RLhub"><b>RL</b></a>';
  html += '<button class="ic-btn" type="button" data-rota="" data-dica="Painel">' + ICONES.painel + '<span class="ic-rot">Início</span></button>';
  Object.keys(ROTAS).forEach(function (k) {
    var r = ROTAS[k];
    html += '<button class="ic-btn" type="button" data-rota="' + k + '" data-dica="' + r.titulo + '">' +
      ICONES[r.icone] + '<span class="ic-rot">' + (r.rotulo || r.titulo) + '</span>' +
      '<span class="tranca" aria-hidden="true"></span></button>';
  });
  html += '<div class="trilho-fim">' +
    '<button class="ic-btn" type="button" id="btnTema" data-dica="Tema"></button>' +
    '<button class="avatar" type="button" id="btnConta" aria-label="Conta">R</button>' +
    '</div>';
  $("trilho").innerHTML = html;

  $("trilho").addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest(".ic-btn") : null;
    if (!b || b.id === "btnTema") return;
    location.hash = "#/" + (b.getAttribute("data-rota") || "");
  });

  $("btnTema").addEventListener("click", function () {
    aplicarTema(temaAtual() === "dark" ? "light" : "dark");
  });
  $("btnConta").addEventListener("click", function (ev) {
    ev.stopPropagation();
    var p = $("contaPop");
    p.setAttribute("data-ver", p.getAttribute("data-ver") === "sim" ? "nao" : "sim");
  });
  document.addEventListener("click", function () { $("contaPop").setAttribute("data-ver", "nao"); });

  /* dica ao lado do ícone */
  var dica = $("dica");
  $("trilho").addEventListener("mouseover", function (ev) {
    var b = ev.target.closest ? ev.target.closest("[data-dica]") : null;
    if (!b) return;
    dica.textContent = b.getAttribute("data-dica");
    var c = b.getBoundingClientRect();
    dica.style.left = (c.right + 10) + "px";
    dica.style.top = (c.top + c.height / 2 - 13) + "px";
    dica.setAttribute("data-ver", "sim");
  });
  $("trilho").addEventListener("mouseout", function () { dica.setAttribute("data-ver", "nao"); });
}

function marcarTrilho(chave) {
  [].forEach.call(document.querySelectorAll(".ic-btn[data-rota]"), function (b) {
    var k = b.getAttribute("data-rota");
    if (k === (chave || "")) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
    var r = ROTAS[k];
    b.setAttribute("data-trancado", (r && r.precisaConta && sb && !sessao) ? "sim" : "nao");
  });
}

/* ── Conta ─────────────────────────────────────────────────────────── */
function nomeDaConta() {
  var e = sessao && sessao.user && sessao.user.email ? sessao.user.email : "";
  if (!e) return "";
  var n = e.split("@")[0].split(/[._-]/)[0];
  return n.charAt(0).toUpperCase() + n.slice(1);
}

function renderConta() {
  document.body.setAttribute("data-conta", !sb ? "dentro" : (sessao ? "dentro" : "fora"));
  var av = $("btnConta");
  if (av) av.textContent = (nomeDaConta().charAt(0) || "R");

  var p = $("contaPop");
  if (!p) return;
  if (sessao) {
    p.innerHTML = '<div class="quem">' + (sessao.user && sessao.user.email ? sessao.user.email : "conectado") + '</div>' +
      '<p class="legenda" style="margin:0">Uma entrada só: as páginas do hub abrem já conectadas.</p>' +
      '<button class="btn-linha" type="button" id="btnSair">Sair</button>';
    var s = $("btnSair");
    if (s) s.addEventListener("click", sairDaConta);
  } else {
    p.innerHTML = '<p class="legenda" style="margin:0">Você não está conectado.</p>' +
      '<button class="btn-linha" type="button" id="btnEntrarPop">Entrar</button>';
    var b = $("btnEntrarPop");
    if (b) b.addEventListener("click", function () { location.hash = "#/entrar"; });
  }
}

async function sairDaConta() {
  if (!sb) return;
  try { await sb.auth.signOut(); } catch (e) {}
  sessao = null;
  $("contaPop").setAttribute("data-ver", "nao");
  renderConta();
  navegar();
}

/* ── Painel ────────────────────────────────────────────────────────── */
function saudacao() {
  var h = new Date().getHours();
  return h < 12 ? "Bom dia" : (h < 18 ? "Boa tarde" : "Boa noite");
}

function renderPainel() {
  var nome = nomeDaConta();
  var hoje = new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });

  var cartoes = Object.keys(ROTAS).map(function (k) {
    var r = ROTAS[k];
    var trancado = r.precisaConta && sb && !sessao;
    return '<button class="w ' + r.tamanho + '" type="button" data-rota="' + k + '" data-busca="' +
        (r.titulo + " " + r.grupo + " " + r.desc).toLowerCase() + '">' +
      '<span class="w-cab"><span class="w-ic">' + ICONES[r.icone] + '</span>' + r.grupo + '</span>' +
      '<h2>' + r.titulo + '</h2>' +
      '<p>' + r.desc + '</p>' +
      '<span class="w-fim" id="dado-' + k + '">' +
        (trancado ? '<span class="selo-trancado">precisa entrar</span>'
                  : '<span class="w-abrir">Abrir' + ICONES.seta + '</span>') +
      '</span>' +
      '<span class="w-pe"><span class="w-end">' + r.url + '</span></span>' +
    '</button>';
  }).join("");

  $("palco").innerHTML =
    '<div class="painel">' +
      '<div class="painel-cab">' +
        '<div class="painel-tit">' +
          '<span class="hoje">' + hoje + '</span>' +
          '<h1 class="ola">' + saudacao() + (nome ? ", " + nome : "") + '</h1>' +
        '</div>' +
        '<div class="cab-fim"><label class="busca">' + ICONES.busca +
          '<input id="busca" type="search" placeholder="Buscar páginas" aria-label="Buscar páginas"></label></div>' +
      '</div>' +
      '<div class="mosaico" id="mosaico">' + cartoes +
        '<p class="vazio" id="vazio" hidden>Nenhuma página com esse nome.</p>' +
      '</div>' +
    '</div>';

  $("mosaico").addEventListener("click", function (ev) {
    var c = ev.target.closest ? ev.target.closest(".w") : null;
    if (c) location.hash = "#/" + c.getAttribute("data-rota");
  });

  $("busca").addEventListener("input", function () {
    var t = this.value.trim().toLowerCase();
    var achou = 0;
    [].forEach.call(document.querySelectorAll(".w"), function (c) {
      var bate = !t || c.getAttribute("data-busca").indexOf(t) >= 0;
      c.hidden = !bate;
      if (bate) achou++;
    });
    $("vazio").hidden = achou > 0;
  });

  preencherWidgets();
}

function preencherWidgets() {
  Object.keys(ROTAS).forEach(async function (k) {
    var fn = PROVEDORES[k];
    if (!fn || !sb || (ROTAS[k].precisaConta && !sessao)) return;
    try {
      var d = await fn(sb);
      var alvo = $("dado-" + k);
      if (!d || !alvo) return;
      // ganho e perda levam seta, nunca só a cor
      var seta = d.tom === "pos" ? ICONES.sobe : (d.tom === "neg" ? ICONES.desce : "");
      alvo.innerHTML = '<span class="w-valor ' + (d.tom || "") + '">' + seta + d.valor + '</span>' +
        (d.legenda ? '<span class="legenda" style="display:block">' + d.legenda + '</span>' : '');
    } catch (e) { console.warn("Widget de " + k + ":", e); }
  });
}

/* ── Página carregada ──────────────────────────────────────────────── */
function renderApp(chave) {
  var r = ROTAS[chave];
  // o GitHub Pages guarda a página por 10 minutos; o carimbo garante a versão nova
  var endereco = r.url + (r.url.indexOf("?") >= 0 ? "&" : "?") + "v=" + Date.now();

  $("palco").innerHTML =
    '<div class="app-cab">' +
      '<span class="grupo">' + r.grupo + ' ·</span>' +
      '<h1>' + r.titulo + '</h1>' +
      '<div class="app-acoes">' +
        '<a class="btn-pequeno" href="' + r.url + '" target="_blank" rel="noopener">' + ICONES.externo + 'Nova aba</a>' +
      '</div>' +
    '</div>' +
    '<div class="moldura">' +
      '<div class="carregando" id="carregando">Carregando ' + r.titulo + '…</div>' +
      '<iframe id="quadro" title="' + r.titulo + '" src="' + endereco + '"></iframe>' +
    '</div>';

  var f = $("quadro");
  f.addEventListener("load", function () {
    var c = $("carregando");
    if (c) c.remove();
    propagarTema();
    ajustarEmbutido(f);
  });
}

/* Dentro do hub, a página não repete a marca nem o botão de tema. */
function ajustarEmbutido(frame) {
  try {
    var doc = frame.contentDocument;
    if (!doc) return;
    var estilo = doc.createElement("style");
    estilo.textContent =
      ".top .logo, .top #tema, .top .tema, #tema { display:none !important; }" +
      ".top { padding-left:16px !important; }";
    doc.head.appendChild(estilo);
  } catch (e) {}
}

/* ── Entrar ────────────────────────────────────────────────────────── */
function renderEntrar(rotaDestino) {
  var r = rotaDestino ? ROTAS[rotaDestino] : null;

  $("palco").innerHTML =
    '<div class="entrar-area"><div class="entrar">' +
      '<div class="marca-grande">' +
        '<span class="selo"><b>RL</b></span>' +
        '<span class="nome"><i>RL</i>hub</span>' +
      '</div>' +
      '<h2>Entrar na sua conta</h2>' +
      '<p class="por-que">' +
        (r ? r.titulo + ' guarda seus dados na sua conta. Entre uma vez aqui e o hub abre a página já conectada.'
           : 'O RLhub abre depois que você entrar. É uma vez só neste navegador.') +
      '</p>' +
      '<form id="formEntrar">' +
        '<div class="campo-bloco">' +
          '<label class="rotulo" for="email">E-mail</label>' +
          '<input id="email" type="email" autocomplete="username" placeholder="voce@exemplo.com" required>' +
        '</div>' +
        '<div class="campo-bloco">' +
          '<label class="rotulo" for="senha">Senha</label>' +
          '<input id="senha" type="password" autocomplete="current-password" placeholder="sua senha" required>' +
        '</div>' +
        '<button class="btn-entrar" id="btnEntrar" type="submit">Entrar</button>' +
      '</form>' +
      '<p class="aviso" id="avisoEntrar" style="display:none"></p>' +
      '<div class="rodape"><p class="legenda" style="margin:0">' +
        'É a mesma conta do Controle de Obras — nada muda no cadastro. ' +
        'A sessão fica só neste navegador.' +
      '</p></div>' +
    '</div></div>';

  $("formEntrar").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var aviso = $("avisoEntrar"), botao = $("btnEntrar");
    aviso.style.display = "none";
    if (!sb) {
      aviso.className = "aviso erro";
      aviso.textContent = "Não consegui carregar a biblioteca de login.";
      aviso.style.display = "block";
      return;
    }
    botao.disabled = true; botao.textContent = "Entrando…";
    try {
      var res = await sb.auth.signInWithPassword({
        email: $("email").value.trim(),
        password: $("senha").value
      });
      if (res.error) {
        aviso.className = "aviso erro";
        aviso.textContent = /invalid/i.test(res.error.message || "")
          ? "E-mail ou senha não conferem."
          : ("Não consegui entrar: " + (res.error.message || "erro desconhecido"));
        aviso.style.display = "block";
        botao.disabled = false; botao.textContent = "Entrar";
        return;
      }
      sessao = res.data.session;
      renderConta();
      location.hash = rotaDestino ? "#/" + rotaDestino : "#/";
      navegar();
    } catch (e) {
      aviso.className = "aviso erro";
      aviso.textContent = "Não consegui entrar: " + (e && e.message ? e.message : e);
      aviso.style.display = "block";
      botao.disabled = false; botao.textContent = "Entrar";
    }
  });

  setTimeout(function () { var e = $("email"); if (e) e.focus(); }, 60);
}

/* ── Navegação ─────────────────────────────────────────────────────── */
function rotaAtual() {
  var h = (location.hash || "").replace(/^#\/?/, "").replace(/\/$/, "");
  if (h === "entrar") return "entrar";
  return ROTAS[h] ? h : "";
}

function navegar() {
  var chave = rotaAtual();

  // enquanto não entrar, o hub inteiro fica fechado
  if (sb && !sessao) {
    marcarTrilho("");
    renderEntrar(chave && chave !== "entrar" ? chave : null);
    return;
  }

  if (chave === "entrar") { location.hash = "#/"; return; }

  marcarTrilho(chave);

  if (chave && ROTAS[chave].precisaConta && !sessao) renderEntrar(chave);
  else if (chave) renderApp(chave);
  else renderPainel();
}

window.addEventListener("hashchange", navegar);

/* ── Inicialização ─────────────────────────────────────────────────── */
montarTrilho();
aplicarTema(loja.get("tema",
  (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"));

(async function () {
  if (sb) {
    try {
      var r = await sb.auth.getSession();
      sessao = (r && r.data) ? r.data.session : null;
    } catch (e) { sessao = null; }
    sb.auth.onAuthStateChange(function (evento, s) {
      var antes = !!sessao;
      sessao = s;
      renderConta();
      if (antes !== !!sessao) navegar();
    });
  }
  renderConta();
  navegar();
})();
</script>
</body>
</html>
